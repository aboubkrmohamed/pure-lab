<section class="text-center pt-3">
  <div class="logo mx-auto mb-3"><i class="fa-solid fa-flask"></i></div>
  <h1 class="h4 fw-bold mb-3">Pure LIS - Reception</h1>
  <h2 class="h5 fw-bold mb-4">{{ labName }}</h2>

  <div class="row g-2 mx-auto tabs">
    @for (t of tabs; track t.route) {
      <div class="col-12 col-md-4">
        <a class="tab-btn {{ t.color }}" [routerLink]="t.route">
          <i class="fa-solid {{ t.icon }}"></i> {{ t.label }}
        </a>
      </div>
    }
  </div>
</section>
