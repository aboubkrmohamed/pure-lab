<div class="wrap">
  <div class="d-flex align-items-center gap-2 p-2">
    <button class="rbtn teal" title="الرئيسية" (click)="store.go('main')"><i class="fa-solid fa-house"></i></button>

    <div class="form-floating flex-grow-1">
      <input #amountEl id="amount" type="number" min="0" class="form-control" placeholder="Enter payment"
             [ngModel]="amount()" (ngModelChange)="amount.set($event)" (keydown.enter)="payCash()" />
      <label for="amount">Enter payment</label>
    </div>

    <button class="rbtn red" title="خصم" (click)="openDiscount()"><i class="fa-solid fa-pen"></i></button>
    <button class="rbtn green" title="دفع بالفيزا" (click)="payCard()"><i class="fa-solid fa-credit-card"></i></button>
  </div>

  <div class="list">
    @for (p of store.payments(); track p.id) {
      <div class="entry" [class.pay]="p.kind === 'payment'" [class.disc]="p.kind === 'discount'">
        <i class="fa-solid fa-paperclip"></i>
        <span class="c">{{ p.kind === 'payment' ? 'Payment' : 'Discount' }}@if (p.method === 'card') { (Card) }</span>
        <span class="c">{{ p.date | date: 'dd MMM yy hh:mm a' }}</span>
        <span class="c">{{ p.amount }}</span>
        <span class="c">{{ p.user }}</span>
        <button class="del" title="حذف" (click)="remove(p.id)"><i class="fa-solid fa-trash"></i></button>
      </div>
    } @empty {
      <div class="text-center text-muted p-5">مفيش مدفوعات لسه</div>
    }
  </div>

  <app-totals-bar />
</div>
