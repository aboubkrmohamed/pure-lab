<app-reg-header title="الملاحظات" />

<div class="p-3" style="max-width: 800px; margin: auto">
  <div class="d-flex gap-2 mb-3">
    <textarea class="form-control" rows="2" placeholder="اكتب ملاحظة... (Ctrl+Enter للإضافة)"
              [ngModel]="text()" (ngModelChange)="text.set($event)"
              (keydown.control.enter)="add()"></textarea>
    <button class="btn btn-primary" (click)="add()"><i class="fa-solid fa-plus"></i></button>
  </div>

  @for (n of store.notes(); track n.id) {
    <div class="card mb-2">
      <div class="card-body d-flex justify-content-between align-items-start gap-2">
        <div>
          <div style="white-space: pre-wrap">{{ n.text }}</div>
          <small class="text-muted">{{ n.user }} - {{ n.date | date: 'dd MMM yy hh:mm a' }}</small>
        </div>
        <button class="btn btn-sm text-danger" (click)="store.removeNote(n.id)"><i class="fa-solid fa-trash"></i></button>
      </div>
    </div>
  } @empty {
    <p class="text-center text-muted p-4">مفيش ملاحظات</p>
  }
  <p class="small text-muted">الملاحظات بتتحفظ مع الزيارة (Ctrl+S).</p>
</div>
